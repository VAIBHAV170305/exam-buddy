<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230284c7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M22 10v6M2 10l10-5 10 5-10 5z'/><path d='M6 12v5c3 3 9 3 12 0v-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Buddy — AI-Powered Educational Companion</title>
    <meta name="description" content="Exam Buddy is an AI-powered academic learning companion providing lecture notes indexing, grounded citations, practice question generation, and revision tools." />
    <meta name="application-name" content="Exam Buddy" />
    <script>
      // Clean up any stale service workers from prior ports or sessions
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        }).catch(function() {});
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-brand-500 selection:text-white">
    <div id="root">
      <div id="boot-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a;">
        <div style="width:48px;height:48px;border-radius:14px;background:#0284c7;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:16px;box-shadow:0 10px 15px -3px rgba(2,132,199,0.3);">
          🎓
        </div>
        <h2 style="font-size:18px;font-weight:700;margin:0 0 6px 0;">EXAM BUDDY</h2>
        <p style="font-size:13px;color:#64748b;margin:0;">Loading AI Academic Companion...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
